[project]
name = "vocalrender-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1",
    "music21>=10.5.0",
]

[dependency-groups]
dev = [
    "gradio==6.15.1",
    "playwright>=1.62.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
